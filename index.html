    <style>
      :root {
        --page: #fbfaf6;

        --accent: #1e8a90;
        --accent-ink: #ffffff;
        --radius-card: 1rem;
        --radius-pill: 999px;
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: #14171a;
          --surface: #1b1f23;
          --line: #2c3136;
          --ink: #edeceb;
          --ink-2: #b8b4ab;
          --accent: #45b8b1;
          --accent-ink: #08211f;
          color-scheme: dark;
        }
      }

      * {
        box-sizing: border-box;
      }

      html {
        font-size: 112.5%;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background-color: var(--page);
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          "Noto Sans Arabic",
          Tahoma,
          sans-serif;
      }

      .card {
        width: 100%;
        max-width: 30rem;
        background-color: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-card);
        padding: 2.5rem 2rem;
        text-align: center;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      }

      .logo {
        width: 3rem;
        height: 3rem;
        margin: 0 auto 1.25rem;
        display: block;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.375rem;
        font-weight: 700;
      }

      p {
        margin: 0 0 1.75rem;
        color: var(--ink-2);
        line-height: 1.7;
      }

      .cta {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background-color: var(--accent);
        color: var(--accent-ink);
        text-decoration: none;
        font-weight: 600;
        padding: 0.75rem 1.5rem;
        border-radius: var(--radius-pill);
        transition: opacity 0.15s ease;
      }

      .cta:hover,
      .cta:focus-visible {
        opacity: 0.88;
      }

      .cta:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .url {
        margin: 1.25rem 0 0;
        font-size: 0.875rem;
        color: var(--ink-2);
        direction: ltr;
        unicode-bidi: isolate;
      }

      .url a {
        color: inherit;
      }
    </style>
